server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Content Security Policy. 'unsafe-inline' for style-src is required: the
    # element renderers use inline style={{...}} props and inject <style> tags.
    # Content Security Policy — relaxed for the demo so the Runtime's rich-media
    # features work AND author SCRIPT steps execute:
    #   script-src 'unsafe-eval'        → SCRIPT steps run author JS (new Function)
    #   img-src/media-src blob:         → images/video packaged in the .WFmasterX
    #                                     zip render from object URLs (fileProcessing.ts)
    #   img-src/media-src https: http:  → remote images/video + video posters
    #   frame-src youtube               → embedded YouTube players (VideoElement.tsx)
    # DELIBERATE security trade-off (accepted for the demo): this weakens the XSS /
    # exfiltration backstop. Meaningful guards are kept: default-src 'self',
    # object-src 'none', base-uri 'self', frame-ancestors 'none'. Only load
    # workflows you trust.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; connect-src 'self' http: https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # strict-origin-when-cross-origin (browser default), NOT no-referrer: the
    # embedded YouTube player returns "Error 153 - Video Player configuration
    # error" when it receives no Referer, and some video CDNs hotlink-check it.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing: serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

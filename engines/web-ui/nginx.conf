server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Content Security Policy. 'unsafe-inline' for style-src is required: the
    # element renderers use inline style={{...}} props and inject <style> tags.
    # script-src 'self' (no unsafe-inline/eval) blocks injected/author scripts —
    # the defense-in-depth backstop for the sanitized rich-text rendering.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA routing: serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
